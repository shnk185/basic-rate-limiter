spring.application.name=basic-rate-limiter

server.port=8080
server.servlet.context-path=/

spring.datasource.url=jdbc:mysql://localhost:3306/basic_rate_limiter
spring.datasource.username=user
spring.datasource.password=userpass
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

basic.rate.limiter.config.admin-key=${ADMIN_KEY:password}
app.jwt.secret=${APP_JWT_SECRET:y6A1DFzkaPjy4lyq0sLZzeQ0vy0i2Ff26t4KatH9rQs=}

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.repositories.enabled=false

management.server.port=8085
management.endpoints.web.exposure.include=*
management.metrics.tags.application=${spring.application.name}